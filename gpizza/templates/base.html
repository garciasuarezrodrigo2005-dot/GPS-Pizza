<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Yungla Pizza{% endblock %} · GPizza</title>
  <meta name="theme-color" content="#1f1b18">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/icono-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gpizza.css') }}">
  {% block cabeza %}{% endblock %}
</head>
<body>
  <header class="gp-encabezado">
    <h1>{% block encabezado %}Yungla Pizza{% endblock %}</h1>
    <small>{% block encabezado_derecha %}{% endblock %}</small>
  </header>

  <main class="gp-contenido">
    {% block contenido %}{% endblock %}
  </main>

  {% block navegacion %}
  <footer class="gp-pie">GPizza v{{ version }} · Yungla Pizza S.A. de C.V.</footer>
  {% endblock %}

  <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/htmx.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/gpizza.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
